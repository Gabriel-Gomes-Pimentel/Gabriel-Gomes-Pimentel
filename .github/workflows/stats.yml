# Regenera o stats.svg do README com dados reais do perfil.
#
# Existe porque os servicos gratuitos de card (github-readme-stats,
# github-profile-summary-cards) caem em rate limit e passam a renderizar
# "ERROR!!! Cards are temporarily rate limited" no lugar das metricas.
# Gerando e commitando o SVG aqui, a imagem e servida pelo proprio GitHub.
name: Atualiza estatisticas

on:
  schedule:
    - cron: "17 4 * * 1" # toda segunda-feira, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gerar_stats.py
      - .github/workflows/stats.yml

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gera o stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gerar_stats.py

      - name: Commita se mudou
        run: |
          if git diff --quiet -- stats.svg; then
            echo "sem mudanca nas metricas"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git commit -m "chore: atualiza estatisticas do perfil"
          git push
