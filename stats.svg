<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-label="Estatísticas do GitHub de Gabriel-Gomes-Pimentel">
  <defs>
    <linearGradient id="borda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#4d5bce" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
  </defs>
  <style>
    .fundo { fill: #0d1117; }
    .moldura { fill: none; stroke: url(#borda); stroke-width: 1.5; }
    .titulo { font: 600 19px 'Segoe UI', Ubuntu, Sans-Serif; fill: url(#titulo); }
    .valor { font: 700 40px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e6edf3; }
    .rotulo { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b5cf6; }
    .nota { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #7d8590; }
    .divisor { stroke: #21262d; stroke-width: 1; }
  </style>
  <rect class="fundo" x="0.75" y="0.75" width="838.5" height="198.5" rx="12" />
  <rect class="moldura" x="0.75" y="0.75" width="838.5" height="198.5" rx="12" />
  <text x="28" y="48" class="titulo">GitHub em números</text>
  <line x1="28" y1="64" x2="812" y2="64" class="divisor" />
  <g>
    <text x="105.0" y="112" class="valor" text-anchor="middle">421</text>
    <text x="105.0" y="140" class="rotulo" text-anchor="middle">Commits</text>
    <text x="105.0" y="160" class="nota" text-anchor="middle">últimos 12 meses</text>
  </g>
  <g>
    <text x="315.0" y="112" class="valor" text-anchor="middle">451</text>
    <text x="315.0" y="140" class="rotulo" text-anchor="middle">Contribuições</text>
    <text x="315.0" y="160" class="nota" text-anchor="middle">últimos 12 meses</text>
  </g>
  <line x1="210.0" y1="80" x2="210.0" y2="165" class="divisor" />
  <g>
    <text x="525.0" y="112" class="valor" text-anchor="middle">17</text>
    <text x="525.0" y="140" class="rotulo" text-anchor="middle">Repositórios</text>
    <text x="525.0" y="160" class="nota" text-anchor="middle">públicos e ativos</text>
  </g>
  <line x1="420.0" y1="80" x2="420.0" y2="165" class="divisor" />
  <g>
    <text x="735.0" y="112" class="valor" text-anchor="middle">6</text>
    <text x="735.0" y="140" class="rotulo" text-anchor="middle">Linguagens</text>
    <text x="735.0" y="160" class="nota" text-anchor="middle">em uso nos projetos</text>
  </g>
  <line x1="630.0" y1="80" x2="630.0" y2="165" class="divisor" />
</svg>
